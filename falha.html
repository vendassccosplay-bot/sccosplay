<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falha no Pagamento | SC COSPLAY</title>

    <link rel="stylesheet" href="public/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <style>
        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60vh; /* Altura mínima para centralizar */
            padding: 40px 20px;
        }
        .status-icon {
            font-size: 5rem;
            /* CORREÇÃO: Cor de erro do seu tema */
            color: var(--color-error, #dc3545); 
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }
        .status-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 10px;
        }
        .status-message {
            font-size: 1.1rem;
            color: var(--color-text-light);
            max-width: 500px;
            margin-bottom: 30px;
        }
        .back-to-cart-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 50px;
            font-size: 0.95rem;
            background: var(--gradient-primary); /* Gradiente do seu tema */
            color: white;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        .back-to-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container header-container">
            <a href="index.html" class="logo-link">
                <img src="public/img/logo.png" alt="Logo SC Cosplay" class="logo"> 
                <span class="logo-text">SC COSPLAY</span>
            </a>
            <div class="header-icons">
                <a href="index.html" id="account-icon" class="header-icon" aria-label="Minha Conta"> <i class="fas fa-home"></i> </a>
            </div>
        </div>
    </header>

    <main>
        <div class="container status-container">
            <div class="status-icon">
                <i class="fas fa-times-circle"></i>
            </div>
            <h1 class="status-title">Ops! Algo deu errado.</h1>
            <p class="status-message">
                Não foi possível processar seu pagamento. Verifique os dados do seu cartão
                ou tente um método de pagamento diferente.
            </p>
            <a href="index.html" class="back-to-cart-btn">
                <i class="fas fa-shopping-cart" style="margin-right: 8px;"></i>
                Voltar e tentar novamente
            </a>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container footer-container">
            <div class="footer-column footer-about">
                <a href="index.html" class="footer-logo-link"> <span class="logo-text">SC COSPLAY</span> </a>
                <p class="footer-description">As melhores fantasias e cosplays.</p>
            </div>
        </div>
        <div class="footer-bottom"> <p>© 2025 SC COSPLAY | Todos os direitos reservados.</p> </div>
    </footer>

</body>
</html>
